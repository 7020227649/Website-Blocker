<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Blocked</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #202124; background: #f8f9fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { width: min(560px, 100%); background: #fff; border: 1px solid #e2e5e9; border-radius: 24px; padding: 40px 32px; text-align: center; box-shadow: 0 12px 40px rgba(32,33,36,.08); }
    .icon { width: 60px; height: 60px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 18px; background: #fce8e6; color: #d93025; font-size: 28px; }
    h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -.03em; }
    p { margin: 0 auto; max-width: 430px; color: #5f6368; line-height: 1.6; }
    button { margin-top: 22px; border: 0; border-radius: 12px; background: #1a73e8; color: #fff; padding: 11px 18px; font-weight: 600; cursor: pointer; }
    button:hover { background: #185abc; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">⛔</div>
    <h1>Website blocked</h1>
    <p>This website is on your Website Blocker list. Open the extension to change your blocked websites or pause protection.</p>
    <button id="back">Go back</button>
  </main>
  <script>
    document.getElementById('back').addEventListener('click', () => history.back());
  </script>
</body>
</html>
